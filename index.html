<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineTier • Movie Tier List</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0f1015;
      --card-bg: #181a20;
      --card-border: #262933;
      --accent-red: #ff334b;
      --accent-glow: rgba(255, 51, 75, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #8b92a5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 51, 75, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(47, 128, 237, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px;
    }

    .app-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Top Navigation */
    header {
      position: relative;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 18px;
      border-radius: 14px;
      min-height: 54px;
    }

    .brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand span {
      background: linear-gradient(135deg, #ff334b, #ff7a00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-pill {
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.06);
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    .status-dot.offline {
      background: #f59e0b;
      box-shadow: 0 0 6px #f59e0b;
    }

    button {
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff334b, #e50914);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #f3f4f6;
      border: 1px solid var(--card-border);
    }

    /* Content Layout */
    .content-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      align-items: start;
    }

    /* Full-width stack on Mobile */
    @media (max-width: 850px) {
      .content-layout {
        grid-template-columns: 1fr;
      }
      .tray-wrapper .results-container {
        flex-wrap: nowrap !important;
        overflow-x: auto !important;
        min-height: 90px !important;
      }
    }

    /* Tier Board */
    .tier-board {
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: #121318;
    }

    .tier-row {
      display: flex;
      min-height: 80px;
      background: var(--card-bg);
    }

    .tier-label {
      width: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: #0c0d12;
      user-select: none;
      flex-shrink: 0;
    }

    .tier-dropzone {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 10px;
      min-height: 80px;
      align-items: center;
    }

    /* Tier Gradients */
    .s-tier { background: linear-gradient(135deg, #ff4e50, #f9d423); }
    .a-tier { background: linear-gradient(135deg, #ff9966, #ff5e62); }
    .b-tier { background: linear-gradient(135deg, #f7971e, #ffd200); }
    .c-tier { background: linear-gradient(135deg, #56ab2f, #a8e063); }
    .d-tier { background: linear-gradient(135deg, #00c6ff, #0072ff); }
    .e-tier { background: linear-gradient(135deg, #8a2387, #e94057); }
    .f-tier { background: linear-gradient(135deg, #ec008c, #fc6767); }

    /* Right Sidebar Panel / Mobile Bottom Dock */
    .sidebar-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-section {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 8px;
      border-radius: 12px;
    }

    .search-section input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      padding-left: 6px;
      min-width: 0;
    }

    .search-section input::placeholder { color: var(--text-muted); }

    /* Single-Tap Info Card */
    .info-card-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-card-header {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .info-card-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .info-card-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .badge-year { background: var(--accent-red); color: #fff; }
    .badge-genre { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid var(--card-border); }

    /* Movie Tray */
    .tray-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tray-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .results-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
      min-height: 100px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 8px;
      border: 1px dashed var(--card-border);
    }

    /* Poster Card */
    .poster-card {
      width: 52px;
      height: 76px;
      object-fit: cover;
      border-radius: 6px;
      cursor: grab;
      user-select: none;
      touch-action: none;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
    }

    .poster-card:active { opacity: 0.7; }
    .drag-over { background: rgba(255, 255, 255, 0.08) !important; }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-card {
      background: #181a20;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-card h3 { font-size: 18px; font-weight: 800; }
    .modal-card p { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

    .modal-card input {
      background: #101116;
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .movie-detail-card { display: flex; gap: 14px; }
    .detail-poster { width: 90px; height: 130px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .detail-info { display: flex; flex-direction: column; gap: 4px; }
    .detail-title { font-size: 16px; font-weight: 800; color: #fff; line-height: 1.2; }
    .detail-meta { font-size: 12px; color: var(--accent-red); font-weight: 700; }
    .detail-sub { font-size: 11px; color: var(--text-muted); }
    .detail-plot { font-size: 12px; color: #d1d5db; line-height: 1.4; margin-top: 4px; max-height: 100px; overflow-y: auto; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Navigation -->
    <header>
      <div class="brand">
        <span>CineTier</span>
      </div>
      <div class="auth-badge">
        <div class="user-pill" id="userPill">
          <div class="status-dot offline" id="statusDot"></div>
          <span id="userDisplayName">Guest</span>
        </div>
        <button class="btn-secondary" id="authBtn" onclick="toggleAuthModal(true)">Sign In</button>
      </div>
    </header>

    <!-- Main Content Layout -->
    <div class="content-layout">

      <!-- Tier Board -->
      <div class="tier-board">
        <div class="tier-row"><div class="tier-label s-tier">S</div><div class="tier-dropzone" data-tier="S"></div></div>
        <div class="tier-row"><div class="tier-label a-tier">A</div><div class="tier-dropzone" data-tier="A"></div></div>
        <div class="tier-row"><div class="tier-label b-tier">B</div><div class="tier-dropzone" data-tier="B"></div></div>
        <div class="tier-row"><div class="tier-label c-tier">C</div><div class="tier-dropzone" data-tier="C"></div></div>
        <div class="tier-row"><div class="tier-label d-tier">D</div><div class="tier-dropzone" data-tier="D"></div></div>
        <div class="tier-row"><div class="tier-label e-tier">E</div><div class="tier-dropzone" data-tier="E"></div></div>
        <div class="tier-row"><div class="tier-label f-tier">F</div><div class="tier-dropzone" data-tier="F"></div></div>
      </div>

      <!-- Search, Details & Tray -->
      <div class="sidebar-panel">
        <div class="search-section">
          <input 
            type="text" 
            id="movieInput" 
            placeholder="Search movie..." 
            oninput="handleSearchInput()" 
            onkeydown="if(event.key==='Enter') searchMovie()" 
          />
          <button class="btn-primary" onclick="searchMovie()">Search</button>
        </div>

        <div class="info-card-wrapper">
          <div class="info-card-header">Selected Movie</div>
          <div class="info-card-content" id="infoCardContent">
            <div class="info-card-title" id="infoTitle" style="color: var(--text-muted); font-size: 13px; font-weight: 500;">Tap any movie to see details</div>
            <div class="info-card-tags" id="infoTags" style="display: none;">
              <span class="badge badge-year" id="infoYear"></span>
              <span class="badge badge-genre" id="infoGenre"></span>
            </div>
          </div>
        </div>

        <div class="tray-wrapper">
          <div class="tray-header">
            <span>Movie Tray</span>
            <span id="trayCount">0 items</span>
          </div>
          <div class="results-container tier-dropzone" id="searchPool" data-tier="pool"></div>
        </div>
      </div>

    </div>

  </div>

  <!-- Sign In Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-card">
      <h3>Sign In to CineTier</h3>
      <p>Enter your unique profile username to sync your tier lists seamlessly across all devices.</p>
      <input type="text" id="usernameInput" placeholder="e.g. febi" />
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px;">
        <button class="btn-secondary" onclick="toggleAuthModal(false)">Cancel</button>
        <button class="btn-primary" onclick="handleAuthSubmit()">Sign In</button>
      </div>
    </div>
  </div>

  <!-- Details Popup Modal -->
  <div class="modal-overlay" id="detailModal" onclick="if(event.target===this) toggleDetailModal(false)">
    <div class="modal-card">
      <div class="movie-detail-card">
        <img id="modalPoster" src="" class="detail-poster" />
        <div class="detail-info">
          <div class="detail-title" id="modalTitle"></div>
          <div class="detail-meta" id="modalMeta"></div>
          <div class="detail-sub" id="modalSub"></div>
          <div class="detail-plot" id="modalPlot"></div>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
        <button class="btn-secondary" style="color: #ff4747;" onclick="deleteActiveMovie()">Delete</button>
        <button class="btn-primary" onclick="toggleDetailModal(false)">Close</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAiiPKs_FM9RCiHYMNJ2Srlh95Lav_3LUQ",
      authDomain: "movie-tier-app.firebaseapp.com",
      projectId: "movie-tier-app",
      storageBucket: "movie-tier-app.firebasestorage.app",
      messagingSenderId: "367793831498",
      appId: "1:367793831498:web:3e60949a51f243bf92f0b3",
      measurementId: "G-HHBCELT29Z"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = localStorage.getItem("cinetier_user") || "";
    let isRemoteUpdate = false;
    let selectedMovieId = null;
    const OMDb_KEY = "trilogy";

    document.addEventListener("DOMContentLoaded", () => {
      initDropzones();
      document.getElementById("searchPool").innerHTML = "";
      updateTrayCount();

      if (currentUser) {
        setLoggedInUI(currentUser);
        connectCloudSync(currentUser);
      } else {
        loadFromLocal();
      }
    });

    function toggleAuthModal(show) {
      const modal = document.getElementById("authModal");
      modal.style.display = show ? "flex" : "none";
      if (show) document.getElementById("usernameInput").focus();
    }

    function toggleDetailModal(show) {
      document.getElementById("detailModal").style.display = show ? "flex" : "none";
    }

    function handleAuthSubmit() {
      const username = document.getElementById("usernameInput").value.trim();
      if (!username) return alert("Please enter a username!");
      
      currentUser = username;
      localStorage.setItem("cinetier_user", username);
      setLoggedInUI(username);
      connectCloudSync(username);
      toggleAuthModal(false);
    }

    function handleLogout() {
      if (confirm("Sign out of this profile?")) {
        localStorage.removeItem("cinetier_user");
        currentUser = "";
        location.reload();
      }
    }

    function setLoggedInUI(username) {
      document.getElementById("userDisplayName").innerText = username;
      document.getElementById("statusDot").classList.remove("offline");
      
      const authBtn = document.getElementById("authBtn");
      authBtn.innerText = "Switch";
      authBtn.onclick = handleLogout;
    }

    function connectCloudSync(userKey) {
      db.collection("tierlists").doc(userKey).onSnapshot((doc) => {
        if (doc.exists) {
          isRemoteUpdate = true;
          renderData(doc.data().board);
          isRemoteUpdate = false;
        }
      });
    }

    function handleSearchInput() {
      const query = document.getElementById("movieInput").value.trim();
      if (!query) {
        const pool = document.getElementById("searchPool");
        pool.innerHTML = "";
        updateTrayCount();
      }
    }

    async function searchMovie() {
      const input = document.getElementById("movieInput");
      const query = input.value.trim();
      const pool = document.getElementById("searchPool");

      if (!query) {
        pool.innerHTML = "";
        updateTrayCount();
        return;
      }

      const res = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(query)}&apikey=${OMDb_KEY}`);
      const data = await res.json();

      pool.innerHTML = "";

      if (data.Search) {
        data.Search.forEach(movie => {
          if (movie.Poster && movie.Poster !== "N/A" && !document.getElementById(movie.imdbID)) {
            const card = createPoster(movie.imdbID, movie.Title, movie.Poster, movie.Year);
            pool.appendChild(card);
          }
        });
      }
      updateTrayCount();
    }

    function createPoster(id, title, posterUrl, year = "", genre = "") {
      const img = document.createElement("img");
      img.src = posterUrl;
      img.alt = title;
      img.className = "poster-card";
      img.draggable = true;
      img.id = id;
      img.dataset.title = title;
      img.dataset.year = year;
      img.dataset.genre = genre;

      let isDragging = false;
      let tapCount = 0;
      let tapTimer = null;

      // Desktop Drag
      img.addEventListener("dragstart", (e) => {
        isDragging = true;
        clearTimeout(tapTimer);
        tapCount = 0;
        e.dataTransfer.setData("text/plain", img.id);
      });

      img.addEventListener("dragend", () => {
        setTimeout(() => isDragging = false, 150);
      });

      // Mobile Touch Drag
      let touchStartX = 0, touchStartY = 0, clone = null;

      img.addEventListener("touchstart", (e) => {
        if (e.touches.length > 1) return;
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }, { passive: true });

      img.addEventListener("touchmove", (e) => {
        const touch = e.touches[0];
        const distX = Math.abs(touch.clientX - touchStartX);
        const distY = Math.abs(touch.clientY - touchStartY);

        if (distX > 10 || distY > 10) {
          isDragging = true;
          if (!clone) {
            clone = img.cloneNode(true);
            clone.style.position = "fixed";
            clone.style.opacity = "0.8";
            clone.style.pointerEvents = "none";
            clone.style.zIndex = "1000";
            document.body.appendChild(clone);
          }
          clone.style.left = `${touch.clientX - 26}px`;
          clone.style.top = `${touch.clientY - 38}px`;
        }
      }, { passive: true });

      img.addEventListener("touchend", (e) => {
        if (clone) {
          clone.remove();
          clone = null;
          const touch = e.changedTouches[0];
          const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
          const dropzone = elemBelow ? elemBelow.closest(".tier-dropzone") : null;
          
          if (dropzone) {
            dropzone.appendChild(img);
            updateTrayCount();
            saveState();
          }
          setTimeout(() => isDragging = false, 150);
        }
      });

      // 1-Tap / 2-Tap / 3-Tap Gestures
      img.addEventListener("click", (e) => {
        if (isDragging) return;

        tapCount++;

        if (tapCount === 1) {
          tapTimer = setTimeout(() => {
            updateInlineInfoCard(id, img);
            tapCount = 0;
          }, 280);
        } else if (tapCount === 2) {
          clearTimeout(tapTimer);
          tapTimer = setTimeout(() => {
            img.remove();
            clearInlineInfoCardIfMatches(id);
            updateTrayCount();
            saveState();
            tapCount = 0;
          }, 260);
        } else if (tapCount >= 3) {
          clearTimeout(tapTimer);
          tapCount = 0;
          showMovieDetails(id, title, posterUrl, img.dataset.year);
        }
      });

      return img;
    }

    async function updateInlineInfoCard(id, imgElement) {
      const infoTitle = document.getElementById("infoTitle");
      const infoYear = document.getElementById("infoYear");
      const infoGenre = document.getElementById("infoGenre");
      const infoTags = document.getElementById("infoTags");

      infoTitle.innerText = imgElement.dataset.title;
      infoTitle.style.color = "#fff";
      infoTitle.style.fontWeight = "700";
      
      infoYear.innerText = imgElement.dataset.year || "Year: N/A";
      infoGenre.innerText = imgElement.dataset.genre ? imgElement.dataset.genre : "Loading Genre...";
      infoTags.style.display = "flex";

      if (!imgElement.dataset.genre) {
        try {
          const res = await fetch(`https://www.omdbapi.com/?i=${id}&apikey=${OMDb_KEY}`);
          const data = await res.json();
          if (data.Response === "True") {
            imgElement.dataset.genre = data.Genre;
            imgElement.dataset.year = data.Year;
            infoYear.innerText = data.Year;
            infoGenre.innerText = data.Genre;
            saveState();
          }
        } catch (err) {
          infoGenre.innerText = "Genre: N/A";
        }
      }
    }

    function clearInlineInfoCardIfMatches(id) {
      const infoTitle = document.getElementById("infoTitle");
      const infoTags = document.getElementById("infoTags");
      infoTitle.innerText = "Tap any movie to see details";
      infoTitle.style.color = "var(--text-muted)";
      infoTitle.style.fontWeight = "500";
      infoTags.style.display = "none";
    }

    async function showMovieDetails(id, fallbackTitle, fallbackPoster, fallbackYear) {
      selectedMovieId = id;
      document.getElementById("modalTitle").innerText = fallbackTitle;
      document.getElementById("modalPoster").src = fallbackPoster;
      document.getElementById("modalMeta").innerText = fallbackYear ? `Year: ${fallbackYear}` : "Loading...";
      document.getElementById("modalSub").innerText = "";
      document.getElementById("modalPlot").innerText = "";
      toggleDetailModal(true);

      try {
        const res = await fetch(`https://www.omdbapi.com/?i=${id}&apikey=${OMDb_KEY}`);
        const data = await res.json();
        if (data.Response === "True") {
          document.getElementById("modalTitle").innerText = data.Title;
          document.getElementById("modalMeta").innerText = `${data.Year} • ${data.Runtime} • ⭐ ${data.imdbRating}`;
          document.getElementById("modalSub").innerText = `Genre: ${data.Genre} | Director: ${data.Director}`;
          document.getElementById("modalPlot").innerText = data.Plot !== "N/A" ? data.Plot : "";
        }
      } catch (err) {
        console.error("Failed to load details", err);
      }
    }

    function deleteActiveMovie() {
      if (selectedMovieId) {
        const el = document.getElementById(selectedMovieId);
        if (el) el.remove();
        clearInlineInfoCardIfMatches(selectedMovieId);
        toggleDetailModal(false);
        updateTrayCount();
        saveState();
      }
    }

    function initDropzones() {
      document.querySelectorAll(".tier-dropzone").forEach(zone => {
        zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag-over"); });
        zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
        zone.addEventListener("drop", (e) => {
          e.preventDefault();
          zone.classList.remove("drag-over");
          const id = e.dataTransfer.getData("text/plain");
          const draggedCard = document.getElementById(id);
          if (draggedCard) {
            zone.appendChild(draggedCard);
            updateTrayCount();
            saveState();
          }
        });
      });
    }

    function updateTrayCount() {
      const count = document.getElementById("searchPool").querySelectorAll(".poster-card").length;
      document.getElementById("trayCount").innerText = `${count} item${count === 1 ? '' : 's'}`;
    }

    function getStateObject() {
      const state = {};
      document.querySelectorAll(".tier-board .tier-dropzone").forEach(zone => {
        const tier = zone.dataset.tier;
        state[tier] = [];
        zone.querySelectorAll(".poster-card").forEach(card => {
          state[tier].push({ 
            id: card.id, 
            title: card.dataset.title, 
            poster: card.src,
            year: card.dataset.year || "",
            genre: card.dataset.genre || ""
          });
        });
      });
      return state;
    }

    function saveState() {
      if (isRemoteUpdate) return;
      const state = getStateObject();
      localStorage.setItem("cinetier_backup", JSON.stringify(state));

      if (db && currentUser) {
        db.collection("tierlists").doc(currentUser).set({ board: state });
      }
    }

    function renderData(state) {
      if (!state) return;
      Object.keys(state).forEach(tier => {
        if (tier === "pool") return;
        const zone = document.querySelector(`.tier-board .tier-dropzone[data-tier="${tier}"]`);
        if (zone) {
          zone.innerHTML = "";
          state[tier].forEach(m => zone.appendChild(createPoster(m.id, m.title, m.poster, m.year, m.genre)));
        }
      });
    }

    function loadFromLocal() {
      const local = localStorage.getItem("cinetier_backup");
      if (local) renderData(JSON.parse(local));
    }
  </script>
</body>
</html>
